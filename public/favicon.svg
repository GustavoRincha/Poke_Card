<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Sombra/Glow de Fundo -->
  <circle cx="50" cy="50" r="48" fill="#0c0e17" stroke="rgba(255, 60, 60, 0.15)" stroke-width="2" />
  
  <!-- Parte Superior Vermelha da Pokebola -->
  <path d="M 15 50 A 35 35 0 0 1 85 50 Z" fill="#ff3c3c" />
  
  <!-- Parte Inferior Branca da Pokebola -->
  <path d="M 85 50 A 35 35 0 0 1 15 50 Z" fill="#ffffff" />
  
  <!-- Faixa Divisória Horizontal Preta -->
  <line x1="15" y1="50" x2="85" y2="50" stroke="#0c0e17" stroke-width="6" />
  
  <!-- Botão Central (Anel Preto) -->
  <circle cx="50" cy="50" r="14" fill="#0c0e17" />
  
  <!-- Botão Central (Parte Branca Externa) -->
  <circle cx="50" cy="50" r="9" fill="#ffffff" />
  
  <!-- Botão Central (Parte Branca Interna com Sombra) -->
  <circle cx="50" cy="50" r="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
</svg>